name: style
on: [push, pull_request]
jobs:
  python-style:
    name: Python Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install and run black
        run: |
          pip install black==26.10.1
          black --check \
            --force-exclude ".*_vendor" \
            .
