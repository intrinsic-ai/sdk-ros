target:
  type: "launch"
  package: "aquarium"
  name: "robotiq.launch.xml"
  dependencies:
    - "robotiq_driver"
    - "robotiq_description"
  rosdep:
    skip:
      - "rviz2"
      - "joint_state_publisher_gui"
      - "ros2_control_test_assets"
  prune:
    patterns:
      - "/usr/include"
      - "/opt/ros/lyrical/include"
      - "/opt/ros/lyrical/opt/zenoh_cpp_vendor/lib/libzenohc.a"
      - "/usr/lib/gcc"
      - "/usr/lib/x86_64-linux-gnu/lib*san.so*"
      - "/usr/lib/x86_64-linux-gnu/*.a"
      - "/usr/share/python-babel-localedata"
      - "/usr/share/fonts"
      - "/usr/share/doc"
      - "/usr/share/man"
      - "/usr/lib/ruby"
      - "/usr/bin/ruby*"
      - "/usr/lib/x86_64-linux-gnu/libruby*"
      - "/workspace/install/ortools_vendor"
      - "/workspace/install/intrinsic_sdk_cmake"
      - "/workspace/install/gz_*_vendor"
      - "/workspace/install/riegeli_vendor"
      - "/workspace/install/tinygltf_vendor"
      - "/workspace/install/opencensus_cpp_vendor"
      - "/workspace/install/prometheus_cpp_vendor"
      - "/workspace/install/pybind11_*_vendor"
      - "/workspace/install/grpc_vendor/opt/grpc_vendor/lib/libgrpc_unsecure*"
      - "/workspace/install/grpc_vendor/opt/grpc_vendor/lib/libprotoc*"
      - "/workspace/install/grpc_vendor/opt/grpc_vendor/lib/libgrpc_authorization_provider*"

types:
  - name: "sensor_msgs/msg/JointState"
    fields:
      - "std_msgs/msg/Header header"
      - "string[] name"
      - "double[] position"
      - "double[] velocity"
      - "double[] effort"
  - name: "std_msgs/msg/Header"
    fields:
      - "builtin_interfaces/msg/Time stamp"
      - "string frame_id"
  - name: "builtin_interfaces/msg/Time"
    fields:
      - "int32 sec"
      - "uint32 nanosec"

interfaces:
  - internal_interface: "ros_action_client"
    internal_name: "/robotiq_gripper_controller/gripper_cmd"
    internal_type: "control_msgs/action/ParallelGripperCommand"
    type_hash: "RIHS01_388b0a9cb34b22db9c6d67b752df85e173f40d6ad1d2a13824f114620f4d3fa1"
    external_interface: "zenoh_queryable_proto"
    external_name: "gripper_cmd"
    external_type: "control_msgs.action.ParallelGripperCommand"
    request_fields:
      - "sensor_msgs/msg/JointState command"
      - "string action_name"
    response_fields:
      - "sensor_msgs/msg/JointState state"
      - "bool stalled"
      - "bool reached_goal"
