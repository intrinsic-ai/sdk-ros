[develop]
script_dir=$base/lib/intrinsic_sdk_bundle_library_py
[install]
install_scripts=$base/lib/intrinsic_sdk_bundle_library_py

[tool:pytest]
norecursedirs = test/functional_tests
# launch_testing registers a tryfirst pytest_ignore_collect hook that returns
# False instead of None, short-circuiting pytest's norecursedirs check.
# This only applies when running tests through ros-tooling/setup-ros, or locally
# installed ros-*-desktop or ros-*-launch-testing.
addopts = -p no:launch_testing -p no:launch_ros

[flake8]
exclude = test/functional_tests
    .git
    __pycache__
    build
    dist
